<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .score-val { color: #38bdf8; font-family: monospace; font-size: 18px; }
    .high-val { color: #fbbf24; font-family: monospace; font-size: 18px; }
    #canvas-wrap {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 {
      font-size: 26px;
      margin-bottom: 8px;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .overlay p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #0369a1; }
    .btn:active { transform: scale(0.97); }
    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-gap: 8px;
      margin-top: 14px;
    }
    .touch-btn {
      width: 56px;
      height: 56px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #94a3b8;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .touch-btn:active { background: #0284c7; color: white; }
    @media (min-width: 640px) {
      .touch-controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>SCORE <span id="score" class="score-val">0</span></div>
    <div>BEST <span id="high" class="high-val">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">RETRO SNAKE</h2>
      <p id="overlay-desc">Use Arrow Keys or WASD</p>
      <button class="btn" id="start-btn">PLAY</button>
    </div>
  </div>

  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" id="t-up">▲</button>
    <div></div>
    <button class="touch-btn" id="t-left">◀</button>
    <button class="touch-btn" id="t-down">▼</button>
    <button class="touch-btn" id="t-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const COLS = 20;
    const ROWS = 20;

    let snake = [];
    let food = { x: 5, y: 5, type: 'normal' };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('unblocked_snake_high') || '0', 10);
    let loopId = null;
    let isRunning = false;
    let speed = 110;

    highEl.textContent = highScore;

    // Web Audio Sound FX
    const audioCtx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      speed = 110;
      scoreEl.textContent = '0';
      spawnFood();
      isRunning = true;
      overlay.classList.add('hidden');
      if (loopId) clearInterval(loopId);
      loopId = setInterval(gameStep, speed);
      draw();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * COLS);
        food.y = Math.floor(Math.random() * ROWS);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
      food.type = Math.random() < 0.2 ? 'golden' : 'normal';
    }

    function gameStep() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        const pts = food.type === 'golden' ? 30 : 10;
        score += pts;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highEl.textContent = highScore;
          localStorage.setItem('unblocked_snake_high', highScore);
        }
        playBeep(food.type === 'golden' ? 660 : 440, 'triangle', 0.1);

        // Slightly increase speed
        if (speed > 55 && score % 40 === 0) {
          speed -= 5;
          clearInterval(loopId);
          loopId = setInterval(gameStep, speed);
        }

        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      isRunning = false;
      clearInterval(loopId);
      playBeep(160, 'sawtooth', 0.3);
      overlayTitle.textContent = 'GAME OVER';
      overlayDesc.textContent = `Score: ${score} · Best: ${highScore}`;
      startBtn.textContent = 'TRY AGAIN';
      overlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid dots
      ctx.fillStyle = '#0f172a';
      for (let x = 0; x < canvas.width; x += GRID) {
        for (let y = 0; y < canvas.height; y += GRID) {
          ctx.fillRect(x + GRID - 1, y + GRID - 1, 1, 1);
        }
      }

      // Draw food
      ctx.save();
      if (food.type === 'golden') {
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 12;
      } else {
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 8;
      }
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw snake
      snake.forEach((seg, i) => {
        ctx.save();
        if (i === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#0284c7';
          ctx.shadowBlur = 8;
        } else {
          const alpha = 1 - (i / snake.length) * 0.45;
          ctx.fillStyle = `rgba(14, 165, 233, ${alpha})`;
        }
        ctx.beginPath();
        const r = 4;
        const x = seg.x * GRID + 2;
        const y = seg.y * GRID + 2;
        const s = GRID - 4;
        ctx.roundRect(x, y, s, s, r);
        ctx.fill();
        ctx.restore();
      });
    }

    function setDirection(x, y) {
      if (!isRunning) return;
      if (x !== 0 && dx === -x) return; // Disallow 180 reverse
      if (y !== 0 && dy === -y) return;
      nextDx = x;
      nextDy = y;
    }

    window.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          setDirection(0, -1);
          e.preventDefault();
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          setDirection(0, 1);
          e.preventDefault();
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          setDirection(-1, 0);
          e.preventDefault();
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          setDirection(1, 0);
          e.preventDefault();
          break;
        case ' ':
          if (!isRunning && overlay.classList.contains('hidden')) {
            // resume
          }
          break;
        case 'r':
        case 'R':
          resetGame();
          break;
      }
    });

    startBtn.addEventListener('click', resetGame);

    document.getElementById('t-up').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('t-down').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('t-left').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('t-right').addEventListener('click', () => setDirection(1, 0));

    draw();
  </script>
</body>
</html>

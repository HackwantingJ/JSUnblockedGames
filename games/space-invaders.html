<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Defenders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 15px;
      font-weight: bold;
    }
    .hud-val { color: #38bdf8; }
    #canvas-wrap {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 28px; color: #38bdf8; margin-bottom: 6px; letter-spacing: 1px; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; text-align: center; max-width: 300px; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .mobile-btns {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .m-btn {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .m-btn:active { background: #0284c7; }
    @media (min-width: 640px) { .mobile-btns { display: none; } }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE <span id="score" class="hud-val">0</span></div>
    <div>WAVE <span id="wave" class="hud-val">1</span></div>
    <div>LIVES <span id="lives" class="hud-val">3</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="460" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h1 id="ov-title">SPACE DEFENDERS</h1>
      <p id="ov-desc">Use Left/Right or A/D to move. Spacebar or Tap to shoot.</p>
      <button class="btn" id="start-btn">LAUNCH MISSION</button>
    </div>
  </div>

  <div class="mobile-btns">
    <button class="m-btn" id="mb-left">◀</button>
    <button class="m-btn" id="mb-fire" style="background:#0284c7; padding: 12px 32px;">FIRE</button>
    <button class="m-btn" id="mb-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const waveEl = document.getElementById('wave');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let score = 0;
    let wave = 1;
    let lives = 3;
    let player = { x: 215, y: 440, w: 30, h: 16, speed: 5 };
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let enemyDir = 1;
    let enemyStepDown = false;
    let enemySpeed = 1;
    let lastEnemyShoot = 0;
    let particles = [];
    let keys = {};

    // Web Audio Synthesizer
    const audioCtx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playSfx(freq1, freq2, type = 'square', duration = 0.08) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
        if (freq2) osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function createWave() {
      enemies = [];
      const rows = 4;
      const cols = 8;
      const startX = 40;
      const startY = 50;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: startX + c * 48,
            y: startY + r * 34,
            w: 26,
            h: 18,
            row: r,
            pts: (4 - r) * 10
          });
        }
      }
      enemySpeed = 1 + wave * 0.2;
      enemyDir = 1;
    }

    function startGame() {
      score = 0;
      wave = 1;
      lives = 3;
      player.x = 215;
      bullets = [];
      enemyBullets = [];
      particles = [];
      createWave();
      scoreEl.textContent = score;
      waveEl.textContent = wave;
      livesEl.textContent = lives;
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function spawnExplosion(x, y, color = '#38bdf8') {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 20,
          color
        });
      }
    }

    function shoot() {
      if (!isPlaying) return;
      if (bullets.length < 3) {
        bullets.push({ x: player.x + player.w / 2 - 1.5, y: player.y, w: 3, h: 10, vy: -7 });
        playSfx(880, 440, 'triangle', 0.06);
      }
    }

    function update() {
      if (!isPlaying) return;

      // Player move
      if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 10) {
        player.x -= player.speed;
      }
      if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.w - 10) {
        player.x += player.speed;
      }

      // Player bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.y < 0) {
          bullets.splice(i, 1);
          continue;
        }
        // Hit enemy
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, '#f59e0b');
            score += e.pts;
            scoreEl.textContent = score;
            playSfx(200, 100, 'square', 0.1);
            enemies.splice(j, 1);
            bullets.splice(i, 1);
            break;
          }
        }
      }

      // Enemy march
      let touchEdge = false;
      enemies.forEach(e => {
        e.x += enemyDir * enemySpeed;
        if (e.x <= 15 || e.x + e.w >= canvas.width - 15) {
          touchEdge = true;
        }
      });

      if (touchEdge) {
        enemyDir = -enemyDir;
        enemies.forEach(e => {
          e.y += 14;
          if (e.y + e.h >= player.y) {
            lives = 0;
          }
        });
      }

      // Enemy fire
      if (Date.now() - lastEnemyShoot > 900 && enemies.length > 0) {
        lastEnemyShoot = Date.now();
        const shooter = enemies[Math.floor(Math.random() * enemies.length)];
        enemyBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 3, h: 8, vy: 4 });
      }

      // Enemy bullets move
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += eb.vy;
        if (eb.y > canvas.height) {
          enemyBullets.splice(i, 1);
          continue;
        }
        // Hit player
        if (eb.x > player.x && eb.x < player.x + player.w && eb.y > player.y && eb.y < player.y + player.h) {
          enemyBullets.splice(i, 1);
          spawnExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ef4444');
          lives--;
          livesEl.textContent = lives;
          playSfx(140, 60, 'sawtooth', 0.25);
          if (lives <= 0) {
            isPlaying = false;
            ovTitle.textContent = 'MISSION FAILED';
            ovDesc.textContent = `Fleet overran your sector. Final Score: ${score}`;
            startBtn.textContent = 'TRY AGAIN';
            overlay.classList.remove('hidden');
          }
        }
      }

      // Wave clear
      if (enemies.length === 0) {
        wave++;
        waveEl.textContent = wave;
        playSfx(440, 880, 'sine', 0.2);
        createWave();
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Starfield
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      for (let i = 0; i < 20; i++) {
        const sx = (i * 47) % canvas.width;
        const sy = (i * 61 + (Date.now() * 0.02)) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Draw player ship
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x + player.w * 0.75, player.y + player.h - 4);
      ctx.lineTo(player.x + player.w * 0.25, player.y + player.h - 4);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      // Bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      ctx.fillStyle = '#ef4444';
      enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));

      // Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.row === 0 ? '#ec4899' : e.row === 1 ? '#a855f7' : e.row === 2 ? '#06b6d4' : '#10b981';
        ctx.fillRect(e.x + 4, e.y, e.w - 8, e.h);
        ctx.fillRect(e.x, e.y + 4, e.w, e.h - 6);
        // Eyes
        ctx.fillStyle = '#020617';
        ctx.fillRect(e.x + 5, e.y + 6, 3, 3);
        ctx.fillRect(e.x + e.w - 8, e.y + 6, 3, 3);
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Spacebar') {
        shoot();
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    startBtn.addEventListener('click', startGame);

    // Mobile controls
    const mbLeft = document.getElementById('mb-left');
    const mbRight = document.getElementById('mb-right');
    const mbFire = document.getElementById('mb-fire');

    mbLeft.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; });
    mbLeft.addEventListener('touchend', e => { e.preventDefault(); keys['ArrowLeft'] = false; });
    mbRight.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; });
    mbRight.addEventListener('touchend', e => { e.preventDefault(); keys['ArrowRight'] = false; });
    mbFire.addEventListener('touchstart', e => { e.preventDefault(); shoot(); });

    loop();
  </script>
</body>
</html>

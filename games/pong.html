<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
    }
    .p-score { color: #38bdf8; }
    .ai-score { color: #ec4899; }
    #canvas-wrap {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 28px; color: #38bdf8; margin-bottom: 6px; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; text-align: center; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="hud">
    <div>YOU <span id="p-score" class="p-score">0</span></div>
    <div>FIRST TO 7</div>
    <div>CPU <span id="ai-score" class="ai-score">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="480" height="340"></canvas>
    <div id="overlay" class="overlay">
      <h1 id="ov-title">CYBER PONG</h1>
      <p id="ov-desc">Move mouse or use W/S / Up/Down keys to control your paddle</p>
      <button class="btn" id="start-btn">SERVE BALL</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const pScoreEl = document.getElementById('p-score');
    const aiScoreEl = document.getElementById('ai-score');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let pScore = 0;
    let aiScore = 0;
    const paddleH = 64;
    const paddleW = 10;
    let player = { y: 138, vy: 0 };
    let cpu = { y: 138, speed: 4 };
    let ball = { x: 240, y: 170, vx: 5, vy: 2, r: 6 };
    let keys = {};

    // Web Audio Synthesizer
    const audioCtx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playHit(freq = 440) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = 5 * direction;
      ball.vy = (Math.random() * 4 - 2);
    }

    function startGame() {
      pScore = 0;
      aiScore = 0;
      pScoreEl.textContent = '0';
      aiScoreEl.textContent = '0';
      resetBall(Math.random() > 0.5 ? 1 : -1);
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function update() {
      if (!isPlaying) return;

      // Player paddle
      if (keys['ArrowUp'] || keys['w'] || keys['W']) {
        player.y = Math.max(0, player.y - 6);
      }
      if (keys['ArrowDown'] || keys['s'] || keys['S']) {
        player.y = Math.min(canvas.height - paddleH, player.y + 6);
      }

      // CPU AI
      const cpuCenter = cpu.y + paddleH / 2;
      if (ball.vx > 0) { // CPU only tracks when ball heads towards it
        if (cpuCenter < ball.y - 12) {
          cpu.y += cpu.speed;
        } else if (cpuCenter > ball.y + 12) {
          cpu.y -= cpu.speed;
        }
      }
      cpu.y = Math.max(0, Math.min(canvas.height - paddleH, cpu.y));

      // Ball move
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/bottom wall bounce
      if (ball.y - ball.r <= 0) {
        ball.y = ball.r;
        ball.vy = -ball.vy;
        playHit(300);
      }
      if (ball.y + ball.r >= canvas.height) {
        ball.y = canvas.height - ball.r;
        ball.vy = -ball.vy;
        playHit(300);
      }

      // Left paddle hit (Player)
      if (ball.x - ball.r <= 25 + paddleW && ball.x - ball.r >= 20) {
        if (ball.y >= player.y && ball.y <= player.y + paddleH) {
          ball.vx = Math.abs(ball.vx) * 1.05; // speed up slightly
          const hit = (ball.y - (player.y + paddleH / 2)) / (paddleH / 2);
          ball.vy = hit * 6;
          playHit(520);
        }
      }

      // Right paddle hit (CPU)
      if (ball.x + ball.r >= canvas.width - 25 - paddleW && ball.x + ball.r <= canvas.width - 20) {
        if (ball.y >= cpu.y && ball.y <= cpu.y + paddleH) {
          ball.vx = -Math.abs(ball.vx) * 1.05;
          const hit = (ball.y - (cpu.y + paddleH / 2)) / (paddleH / 2);
          ball.vy = hit * 6;
          playHit(480);
        }
      }

      // Scoring
      if (ball.x < 0) {
        aiScore++;
        aiScoreEl.textContent = aiScore;
        playHit(200);
        checkWinner();
        resetBall(1);
      } else if (ball.x > canvas.width) {
        pScore++;
        pScoreEl.textContent = pScore;
        playHit(700);
        checkWinner();
        resetBall(-1);
      }
    }

    function checkWinner() {
      if (pScore >= 7 || aiScore >= 7) {
        isPlaying = false;
        ovTitle.textContent = pScore >= 7 ? 'VICTORY!' : 'CPU WON';
        ovDesc.textContent = `Final match result: ${pScore} - ${aiScore}`;
        startBtn.textContent = 'PLAY REMATCH';
        overlay.classList.remove('hidden');
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed line
      ctx.strokeStyle = '#1e293b';
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Player paddle
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(25, player.y, paddleW, paddleH, 4);
      ctx.fill();

      // CPU paddle
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.roundRect(canvas.width - 25 - paddleW, cpu.y, paddleW, paddleH, 4);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => { keys[e.key] = true; });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = e.clientY - rect.top;
      player.y = Math.max(0, Math.min(canvas.height - paddleH, mouseY - paddleH / 2));
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touchY = e.touches[0].clientY - rect.top;
      player.y = Math.max(0, Math.min(canvas.height - paddleH, touchY - paddleH / 2));
    }, { passive: false });

    startBtn.addEventListener('click', startGame);

    loop();
  </script>
</body>
</html>

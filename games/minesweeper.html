<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .digital-lcd {
      background: #000;
      color: #ef4444;
      font-family: monospace;
      font-size: 22px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
      min-width: 54px;
      text-align: center;
    }
    .face-btn {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:active { background: #334155; }
    .grid {
      display: grid;
      gap: 2px;
      background: #1e293b;
      padding: 4px;
      border-radius: 8px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s;
    }
    .cell:hover { background: #475569; }
    .cell.revealed {
      background: #0f172a;
      cursor: default;
    }
    .cell.mine { background: #dc2626 !important; }
    .c1 { color: #38bdf8; }
    .c2 { color: #4ade80; }
    .c3 { color: #f87171; }
    .c4 { color: #818cf8; }
    .c5 { color: #fb923c; }
    .c6 { color: #2dd4bf; }
    .c7 { color: #f472b6; }
    .c8 { color: #94a3b8; }
    .mode-toggle {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .flag-mode-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .flag-mode-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <div id="mine-count" class="digital-lcd">010</div>
      <button class="face-btn" id="face-btn">🙂</button>
      <div id="timer" class="digital-lcd">000</div>
    </div>
    <div id="grid" class="grid"></div>
    <div class="mode-toggle">
      <span>Right click to flag (or toggle below)</span>
      <button id="flag-btn" class="flag-mode-btn">🚩 Flag Mode: OFF</button>
    </div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let board = [];
    let state = 'IDLE'; // IDLE, PLAYING, WON, LOST
    let flagMode = false;
    let timerVal = 0;
    let timerId = null;
    let flagsPlaced = 0;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face-btn');
    const flagBtn = document.getElementById('flag-btn');

    gridEl.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;

    function init() {
      state = 'IDLE';
      clearInterval(timerId);
      timerVal = 0;
      timerEl.textContent = '000';
      faceBtn.textContent = '🙂';
      flagsPlaced = 0;
      updateMineCounter();

      board = [];
      gridEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          const cell = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            adjacent: 0,
            el: null
          };
          const div = document.createElement('div');
          div.className = 'cell';
          div.addEventListener('click', () => onCellClick(cell));
          div.addEventListener('contextmenu', e => {
            e.preventDefault();
            toggleFlag(cell);
          });
          gridEl.appendChild(div);
          cell.el = div;
          row.push(cell);
        }
        board.push(row);
      }
    }

    function plantMines(safeR, safeC) {
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!board[r][c].isMine && !(Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1)) {
          board[r][c].isMine = true;
          placed++;
        }
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                  count++;
                }
              }
            }
            board[r][c].adjacent = count;
          }
        }
      }
    }

    function startTimer() {
      timerId = setInterval(() => {
        timerVal = Math.min(999, timerVal + 1);
        timerEl.textContent = String(timerVal).padStart(3, '0');
      }, 1000);
    }

    function updateMineCounter() {
      const left = Math.max(0, MINES - flagsPlaced);
      mineCountEl.textContent = String(left).padStart(3, '0');
    }

    function toggleFlag(cell) {
      if (cell.revealed || state === 'WON' || state === 'LOST') return;
      cell.flagged = !cell.flagged;
      cell.el.textContent = cell.flagged ? '🚩' : '';
      flagsPlaced += cell.flagged ? 1 : -1;
      updateMineCounter();
    }

    function onCellClick(cell) {
      if (state === 'WON' || state === 'LOST') return;

      if (flagMode) {
        toggleFlag(cell);
        return;
      }

      if (cell.flagged) return;

      if (state === 'IDLE') {
        plantMines(cell.r, cell.c);
        state = 'PLAYING';
        startTimer();
      }

      reveal(cell);
      checkWin();
    }

    function reveal(cell) {
      if (cell.revealed || cell.flagged) return;
      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.isMine) {
        cell.el.classList.add('mine');
        cell.el.textContent = '💣';
        gameOver(false);
        return;
      }

      if (cell.adjacent > 0) {
        cell.el.textContent = cell.adjacent;
        cell.el.classList.add('c' + cell.adjacent);
      } else {
        // Flood fill
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = cell.r + dr;
            const nc = cell.c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              reveal(board[nr][nc]);
            }
          }
        }
      }
    }

    function gameOver(won) {
      clearInterval(timerId);
      state = won ? 'WON' : 'LOST';
      faceBtn.textContent = won ? '😎' : '😵';

      if (!won) {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = board[r][c];
            if (cell.isMine && !cell.flagged) {
              cell.el.textContent = '💣';
            }
          }
        }
      }
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          if (!cell.isMine && !cell.revealed) {
            unrevealedSafe++;
          }
        }
      }
      if (unrevealedSafe === 0) {
        gameOver(true);
      }
    }

    faceBtn.addEventListener('click', init);
    flagBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagBtn.classList.toggle('active', flagMode);
      flagBtn.textContent = `🚩 Flag Mode: ${flagMode ? 'ON' : 'OFF'}`;
    });

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 560px;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
    }
    .hud-val { color: #38bdf8; }
    #canvas-wrap {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    canvas { display: block; cursor: pointer; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 28px; color: #38bdf8; margin-bottom: 6px; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; text-align: center; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="hud">
    <div>HI <span id="high-score" style="color:#fbbf24">0</span></div>
    <div>SCORE <span id="score" class="hud-val">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="540" height="240"></canvas>
    <div id="overlay" class="overlay">
      <h1 id="ov-title">CYBER RUNNER</h1>
      <p id="ov-desc">Press Spacebar, Up Arrow or Click/Tap to Jump</p>
      <button class="btn" id="start-btn">START SPRINT</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('unblocked_dino_high') || '0', 10);
    highEl.textContent = highScore;

    const groundY = 200;
    let dino = { x: 50, y: groundY - 32, w: 26, h: 32, vy: 0, jump: -10.5, gravity: 0.6, grounded: true };
    let obstacles = [];
    let speed = 6;
    let frame = 0;

    // Web Audio Synthesizer
    const audioCtx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playBeep(freq, dur = 0.08) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function jump() {
      if (!isPlaying) return;
      if (dino.grounded) {
        dino.vy = dino.jump;
        dino.grounded = false;
        playBeep(420, 0.06);
      }
    }

    function startGame() {
      score = 0;
      speed = 6;
      frame = 0;
      obstacles = [];
      dino.y = groundY - 32;
      dino.vy = 0;
      dino.grounded = true;
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function gameOver() {
      isPlaying = false;
      playBeep(160, 0.25);
      if (score > highScore) {
        highScore = score;
        highEl.textContent = highScore;
        localStorage.setItem('unblocked_dino_high', highScore);
      }
      ovTitle.textContent = 'SYSTEM COLLISION';
      ovDesc.textContent = `Distance: ${score} · Record: ${highScore}`;
      startBtn.textContent = 'RUN AGAIN';
      overlay.classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;
      frame++;
      score++;
      scoreEl.textContent = score;

      if (score % 250 === 0 && speed < 14) speed += 0.5;

      // Dino physics
      dino.vy += dino.gravity;
      dino.y += dino.vy;

      if (dino.y >= groundY - dino.h) {
        dino.y = groundY - dino.h;
        dino.vy = 0;
        dino.grounded = true;
      }

      // Spawn obstacles
      const spawnRate = Math.max(45, Math.floor(90 - speed * 3));
      if (frame % spawnRate === 0 && Math.random() < 0.8) {
        const isTall = Math.random() > 0.6;
        obstacles.push({
          x: canvas.width,
          w: isTall ? 18 : 14,
          h: isTall ? 36 : 24,
          y: groundY - (isTall ? 36 : 24)
        });
      }

      // Move obstacles & detect collision
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision check
        if (dino.x + dino.w - 4 > obs.x && dino.x + 4 < obs.x + obs.w &&
            dino.y + dino.h - 4 > obs.y) {
          gameOver();
          return;
        }

        if (obs.x + obs.w < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground line
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      // Ground bumps
      ctx.fillStyle = '#1e293b';
      for (let i = 0; i < 10; i++) {
        const gx = ((i * 70) - (frame * speed) % 70);
        ctx.fillRect(gx, groundY + 4, 15, 2);
      }

      // Draw Dino
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(dino.x, dino.y, dino.w, dino.h - 8, 4);
      ctx.fill();
      // Legs
      const legOffset = (frame % 10 < 5 && dino.grounded) ? 4 : 0;
      ctx.fillRect(dino.x + 4, dino.y + dino.h - 8, 4, 8 - legOffset);
      ctx.fillRect(dino.x + dino.w - 8, dino.y + dino.h - 8, 4, 8 - (4 - legOffset));

      // Eye
      ctx.fillStyle = '#020617';
      ctx.fillRect(dino.x + dino.w - 7, dino.y + 4, 3, 3);

      // Draw obstacles (Cacti/Barriers)
      ctx.fillStyle = '#ef4444';
      obstacles.forEach(obs => {
        ctx.beginPath();
        ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 3);
        ctx.fill();
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
        jump();
        e.preventDefault();
      }
    });

    canvas.addEventListener('mousedown', jump);
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      jump();
    }, { passive: false });

    startBtn.addEventListener('click', startGame);

    loop();
  </script>
</body>
</html>

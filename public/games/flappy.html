<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Copter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #canvas-wrap {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    canvas { display: block; cursor: pointer; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 28px; color: #38bdf8; margin-bottom: 6px; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="game" width="360" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h1 id="ov-title">FLAPPY COPTER</h1>
      <p id="ov-desc">Press Spacebar or Click/Tap anywhere to fly</p>
      <button class="btn" id="start-btn">TAP TO FLY</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let score = 0;
    let best = parseInt(localStorage.getItem('unblocked_flappy_best') || '0', 10);
    let bird = { x: 80, y: 220, vy: 0, r: 12, gravity: 0.38, jump: -6.5 };
    let pipes = [];
    let frame = 0;

    // Web Audio Synthesizer
    const audioCtx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playBeep(freq, duration = 0.08) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function flap() {
      if (!isPlaying) return;
      bird.vy = bird.jump;
      playBeep(480, 0.05);
    }

    function startGame() {
      score = 0;
      bird.y = 220;
      bird.vy = 0;
      pipes = [];
      frame = 0;
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function gameOver() {
      isPlaying = false;
      playBeep(180, 0.25);
      if (score > best) {
        best = score;
        localStorage.setItem('unblocked_flappy_best', best);
      }
      ovTitle.textContent = 'CRASHED!';
      ovDesc.textContent = `Score: ${score} · Best: ${best}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;
      frame++;
      bird.vy += bird.gravity;
      bird.y += bird.vy;

      // Floor & ceiling
      if (bird.y + bird.r >= canvas.height - 20) {
        gameOver();
        return;
      }
      if (bird.y - bird.r <= 0) {
        bird.y = bird.r;
        bird.vy = 0;
      }

      // Spawn pipes
      if (frame % 85 === 0) {
        const gap = 125;
        const minH = 40;
        const maxH = canvas.height - 20 - gap - minH;
        const topH = Math.floor(Math.random() * (maxH - minH)) + minH;
        pipes.push({
          x: canvas.width,
          w: 48,
          topH,
          gap,
          passed: false
        });
      }

      // Move pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.6;

        // Collision check
        const bottomY = p.topH + p.gap;
        if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w) {
          if (bird.y - bird.r < p.topH || bird.y + bird.r > bottomY) {
            gameOver();
            return;
          }
        }

        // Score pass
        if (!p.passed && p.x + p.w < bird.x) {
          p.passed = true;
          score++;
          playBeep(640, 0.06);
        }

        if (p.x + p.w < 0) {
          pipes.splice(i, 1);
        }
      }
    }

    function draw() {
      // Sky
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant skyline
      ctx.fillStyle = '#1e293b';
      for (let i = 0; i < 8; i++) {
        const bx = i * 50;
        const bh = 40 + (i % 3) * 25;
        ctx.fillRect(bx, canvas.height - 20 - bh, 45, bh);
      }

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#10b981';
        // Top pipe
        ctx.fillRect(p.x, 0, p.w, p.topH);
        ctx.fillRect(p.x - 3, p.topH - 12, p.w + 6, 12);
        // Bottom pipe
        const botY = p.topH + p.gap;
        ctx.fillRect(p.x, botY, p.w, canvas.height - 20 - botY);
        ctx.fillRect(p.x - 3, botY, p.w + 6, 12);
      });

      // Ground
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08));
      ctx.rotate(angle);

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(4, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(6, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(8, -1);
      ctx.lineTo(16, 2);
      ctx.lineTo(8, 5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // Score counter
      if (isPlaying) {
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(score, canvas.width / 2, 60);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        flap();
        e.preventDefault();
      }
    });

    canvas.addEventListener('mousedown', flap);
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      flap();
    }, { passive: false });

    startBtn.addEventListener('click', startGame);

    loop();
  </script>
</body>
</html>
